<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 532 540" width="532" height="540" role="img" aria-labelledby="t d" data-cor-do-pulso="#66a4f5" data-compacta="">
  <title id="t">Grimoire: per-platform packaging (illustration)</title>
  <desc id="d">The skills/&lt;name&gt;/SKILL.md folder, the canonical implementation, is exposed to four platforms: Claude Code (.claude-plugin/plugin.json and marketplace.json), Codex (.codex-plugin/plugin.json pointing to ./skills/), Pi (.pi/settings.json pointing to ../skills and extensions/) and Hermes Agent (installation guide with external_dirs or a GitHub tap).</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66a4f5"/>
    </marker>
    <radialGradient id="fundo" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#171717"/>
    </radialGradient>
    <pattern id="grade" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28,0 L0,0 L0,28" fill="none" stroke="#66a4f5" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="brilho" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .caixa { fill: #242424; stroke: #4a82d4; stroke-width: 1.5; }
      .centro { fill: #242424; stroke: #a9cdfa; stroke-width: 2.5; }
      .nome { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; }
      .det { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a6a6a6; }
      .rotulo { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #66a4f5; letter-spacing: 0.08em; }
      .linha { stroke: #66a4f5; stroke-width: 1.75; fill: none; marker-end: url(#seta); }
    </style>
  </defs>
  <rect width="532" height="540" fill="url(#fundo)"/>
  <rect width="532" height="540" fill="url(#grade)"/>

  <!-- estrelas -->
  <g fill="#f0f0f0" aria-hidden="true">
    <circle cx="30" cy="70" r="1.2" opacity="0.7"/>
    <circle cx="100" cy="62" r="1" opacity="0.5"/>
    <circle cx="150" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="40" cy="150" r="1.5" opacity="0.8"/>
    <circle cx="28" cy="380" r="1.2" opacity="0.6"/>
    <circle cx="120" cy="400" r="1" opacity="0.5"/>
    <circle cx="90" cy="445" r="1.5" opacity="0.7"/>
    <circle cx="160" cy="350" r="1" opacity="0.5"/>
    <circle cx="510" cy="36" r="1.5" opacity="0.8"/>
    <circle cx="520" cy="470" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="515" r="1" opacity="0.5"/>
    <circle cx="470" cy="440" r="1" opacity="0.4"/>
  </g>

  <text x="16" y="28" class="rotulo">ILUSTRAÇÃO · ILLUSTRATION</text>
  <text x="516" y="28" class="rotulo" text-anchor="end">README.md</text>

  <!-- skills/ -->
  <rect x="14" y="194" width="150" height="110" rx="8" class="centro" filter="url(#brilho)"/>
  <text x="28" y="236" class="nome">skills/</text>
  <text x="28" y="262" class="det">&lt;name&gt;/SKILL.md</text>

  <!-- Claude Code -->
  <rect x="204" y="54" width="314" height="84" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="220" y="86" class="nome">Claude Code</text>
  <text x="220" y="108" class="det">.claude-plugin/plugin.json</text>
  <text x="220" y="128" class="det">marketplace.json: grimoire@migliatti</text>
  <!-- Codex -->
  <rect x="204" y="156" width="314" height="84" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="220" y="188" class="nome">Codex</text>
  <text x="220" y="210" class="det">.codex-plugin/plugin.json</text>
  <text x="220" y="230" class="det">skills: ./skills/</text>
  <!-- Pi -->
  <rect x="204" y="258" width="314" height="84" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="220" y="290" class="nome">Pi</text>
  <text x="220" y="312" class="det">.pi/settings.json</text>
  <text x="220" y="332" class="det">skills: ../skills + extensions/</text>
  <!-- Hermes Agent -->
  <rect x="204" y="360" width="314" height="84" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="220" y="392" class="nome">Hermes Agent</text>
  <text x="220" y="414" class="det">docs/installation/hermes-agent.md</text>
  <text x="220" y="434" class="det">external_dirs · GitHub tap</text>

  <!-- skills/ -> plataformas -->
  <line x1="164" y1="249" x2="204" y2="96" class="linha"/>
  <line x1="164" y1="249" x2="204" y2="198" class="linha"/>
  <line x1="164" y1="249" x2="204" y2="300" class="linha"/>
  <line x1="164" y1="249" x2="204" y2="402" class="linha"/>

  <text x="266" y="488" class="det" text-anchor="middle">──▶ exposta a · exposed to</text>
  <text x="266" y="508" class="det" text-anchor="middle">skills/ = implementação canônica · canonical implementation</text>
  <text x="266" y="528" class="det" text-anchor="middle">Fonte · Source: README.md, docs/installation/</text>
</svg>

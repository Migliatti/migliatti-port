<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" width="360" height="350" role="img" aria-labelledby="t d" data-cor-do-pulso="#66a4f5">
  <title id="t">LabReserve: modular monolith (illustration)</title>
  <desc id="d">Modules web, server, application, domain and persistence. Dependencies point inward: web and server depend on application; application depends on domain; persistence implements the contracts. The domain imports nothing from HTTP, React or SQLite.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66a4f5"/>
    </marker>
    <radialGradient id="fundo" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#171717"/>
    </radialGradient>
    <pattern id="grade" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28,0 L0,0 L0,28" fill="none" stroke="#66a4f5" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="brilho" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .caixa { fill: #242424; stroke: #4a82d4; stroke-width: 1.5; }
      .centro { fill: #242424; stroke: #a9cdfa; stroke-width: 2.5; }
      .nome { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; }
      .det { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #a6a6a6; }
      .rotulo { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #66a4f5; letter-spacing: 0.04em; }
      .linha { stroke: #66a4f5; stroke-width: 1.75; fill: none; marker-end: url(#seta); }
      .tracejada { stroke: #66a4f5; stroke-width: 1.75; fill: none; stroke-dasharray: 6 4; marker-end: url(#seta); }
      .nome { font-size: 16px; }
      .det { font-size: 16px; }
      .rotulo { font-size: 16px; }
    </style>
  </defs>
  <rect width="360" height="350" fill="url(#fundo)"/>
  <rect width="360" height="350" fill="url(#grade)"/>

  <!-- estrelas -->
  <g fill="#f0f0f0" aria-hidden="true">
    <circle cx="14" cy="70" r="1.2" opacity="0.7"/>
    <circle cx="346" cy="77" r="1.5" opacity="0.8"/>
    <circle cx="180" cy="60" r="1" opacity="0.5"/>
    <circle cx="18" cy="210" r="1" opacity="0.5"/>
    <circle cx="342" cy="196" r="1.2" opacity="0.6"/>
    <circle cx="187" cy="224" r="1.2" opacity="0.6"/>
    <circle cx="29" cy="340" r="1.2" opacity="0.6"/>
    <circle cx="335" cy="333" r="1" opacity="0.5"/>
  </g>

  <text x="10" y="24" class="rotulo">ILUSTRAÇÃO · ILLUSTRATION</text>

  <!-- web -->
  <rect x="10" y="40" width="166" height="60" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="20" y="66" class="nome">web/</text>
  <text x="20" y="87" class="det">React + Vite</text>

  <!-- server -->
  <rect x="184" y="40" width="166" height="60" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="194" y="66" class="nome">server/</text>
  <text x="194" y="87" class="det">node:http, routes</text>

  <!-- application -->
  <rect x="70" y="130" width="220" height="60" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="80" y="156" class="nome">application/</text>
  <text x="80" y="177" class="det">LabReserveService</text>

  <!-- domain -->
  <rect x="10" y="220" width="192" height="76" rx="8" class="centro" filter="url(#brilho)"/>
  <text x="20" y="246" class="nome">domain/</text>
  <text x="20" y="267" class="det">TimeInterval</text>
  <text x="20" y="285" class="det">no HTTP, React, SQLite</text>

  <!-- persistence -->
  <rect x="210" y="220" width="140" height="76" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="220" y="246" class="nome">persistence/</text>
  <text x="220" y="267" class="det">SQLite</text>

  <!-- web -> application, server -> application, application -> domain, persistence -> application (implementa contratos) -->
  <path d="M93,100 C100,112 112,120 124,129" class="linha"/>
  <path d="M267,100 C260,112 248,120 236,129" class="linha"/>
  <path d="M124,190 C112,200 104,210 100,219" class="linha"/>
  <path d="M280,219 C272,208 258,198 246,190" class="tracejada"/>

  <text x="180" y="318" class="det" text-anchor="middle">──▶ depende de · depends on</text>
  <text x="180" y="338" class="det" text-anchor="middle">- -▶ implementa · implements</text>
</svg>

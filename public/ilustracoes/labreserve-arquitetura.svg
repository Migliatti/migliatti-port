<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-labelledby="t d" data-cor-do-pulso="#d6a85f">
  <title id="t">LabReserve: modular monolith (illustration)</title>
  <desc id="d">Modules web, server, application, domain and persistence. Dependencies point inward: web and server depend on application; application depends on domain and on repository contracts; persistence implements the contracts with SQLite. The domain imports nothing from HTTP, React or SQLite.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a85f"/>
    </marker>
    <radialGradient id="fundo" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#19150f"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <pattern id="grade" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28,0 L0,0 L0,28" fill="none" stroke="#d6a85f" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="brilho" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .caixa { fill: #19150f; stroke: #c79a52; stroke-width: 1.5; }
      .centro { fill: #19150f; stroke: #f0c97a; stroke-width: 2.5; }
      .nome { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ece8df; }
      .det { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b3ab9c; }
      .rotulo { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #d6a85f; letter-spacing: 0.08em; }
      .linha { stroke: #d6a85f; stroke-width: 1.75; fill: none; marker-end: url(#seta); }
      .tracejada { stroke: #d6a85f; stroke-width: 1.75; fill: none; stroke-dasharray: 6 4; marker-end: url(#seta); }
    </style>
  </defs>
  <rect width="560" height="560" fill="url(#fundo)"/>
  <rect width="560" height="560" fill="url(#grade)"/>

  <!-- estrelas -->
  <g fill="#ece8df" aria-hidden="true">
    <circle cx="30" cy="150" r="1.2" opacity="0.7"/>
    <circle cx="530" cy="170" r="1.5" opacity="0.8"/>
    <circle cx="70" cy="300" r="1" opacity="0.5"/>
    <circle cx="500" cy="290" r="1.2" opacity="0.6"/>
    <circle cx="26" cy="480" r="1.5" opacity="0.7"/>
    <circle cx="536" cy="500" r="1" opacity="0.5"/>
    <circle cx="205" cy="160" r="1" opacity="0.5"/>
    <circle cx="360" cy="320" r="1.2" opacity="0.6"/>
    <circle cx="250" cy="480" r="1" opacity="0.5"/>
    <circle cx="450" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="300" cy="534" r="1.2" opacity="0.6"/>
  </g>

  <text x="16" y="28" class="rotulo">ILUSTRAÇÃO · ILLUSTRATION</text>
  <text x="544" y="28" class="rotulo" text-anchor="end">docs/ARCHITECTURE.md</text>

  <!-- web -->
  <rect x="12" y="58" width="262" height="80" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="28" y="90" class="nome">web/</text>
  <text x="28" y="116" class="det">React + Vite, HTTP client</text>

  <!-- server -->
  <rect x="286" y="58" width="262" height="80" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="302" y="90" class="nome">server/</text>
  <text x="302" y="116" class="det">node:http, routes, validation</text>

  <!-- application -->
  <rect x="135" y="200" width="290" height="80" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="151" y="232" class="nome">application/</text>
  <text x="151" y="258" class="det">LabReserveService, contracts</text>

  <!-- domain -->
  <rect x="12" y="360" width="262" height="92" rx="8" class="centro" filter="url(#brilho)"/>
  <text x="28" y="392" class="nome">domain/</text>
  <text x="28" y="416" class="det">TimeInterval, Reservation</text>
  <text x="28" y="436" class="det">no HTTP, React or SQLite</text>

  <!-- persistence -->
  <rect x="286" y="360" width="262" height="92" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="302" y="392" class="nome">persistence/</text>
  <text x="302" y="416" class="det">SQLite (node:sqlite)</text>
  <text x="302" y="436" class="det">implements contracts</text>

  <!-- web -> application, server -> application -->
  <path d="M143,138 L235,198" class="linha"/>
  <path d="M417,138 L325,198" class="linha"/>
  <!-- application -> domain -->
  <path d="M235,280 L150,358" class="linha"/>
  <!-- persistence -> application (implementa contratos) -->
  <path d="M417,358 L345,282" class="tracejada"/>

  <text x="280" y="508" class="det" text-anchor="middle">──▶ depende de · depends on</text>
  <text x="280" y="528" class="det" text-anchor="middle">- -▶ implementa · implements</text>
</svg>

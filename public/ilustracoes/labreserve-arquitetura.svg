<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-labelledby="t d" data-cor-do-pulso="#d6a85f" data-compacta="">
  <title id="t">LabReserve: modular monolith (illustration)</title>
  <desc id="d">Modules web, server, application, domain and persistence. Dependencies point inward: web and server depend on application; application depends on domain and on repository contracts; persistence implements the contracts with SQLite. The domain imports nothing from HTTP, React or SQLite.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a85f"/>
    </marker>
    <radialGradient id="fundo" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#19150f"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <pattern id="grade" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28,0 L0,0 L0,28" fill="none" stroke="#d6a85f" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="brilho" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .caixa { fill: #19150f; stroke: #c79a52; stroke-width: 1.5; }
      .centro { fill: #19150f; stroke: #f0c97a; stroke-width: 2.5; }
      .nome { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ece8df; }
      .det { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b3ab9c; }
      .rotulo { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #d6a85f; letter-spacing: 0.08em; }
      .linha { stroke: #d6a85f; stroke-width: 1.75; fill: none; marker-end: url(#seta); }
      .tracejada { stroke: #d6a85f; stroke-width: 1.75; fill: none; stroke-dasharray: 6 4; marker-end: url(#seta); }
    </style>
  </defs>
  <rect width="560" height="520" fill="url(#fundo)"/>
  <rect width="560" height="520" fill="url(#grade)"/>

  <!-- estrelas -->
  <g fill="#ece8df" aria-hidden="true">
    <circle cx="28" cy="140" r="1.2" opacity="0.7"/>
    <circle cx="532" cy="156" r="1.5" opacity="0.8"/>
    <circle cx="67" cy="270" r="1" opacity="0.5"/>
    <circle cx="504" cy="260" r="1.2" opacity="0.6"/>
    <circle cx="28" cy="442" r="1.5" opacity="0.7"/>
    <circle cx="538" cy="463" r="1" opacity="0.5"/>
    <circle cx="207" cy="146" r="1" opacity="0.5"/>
    <circle cx="358" cy="296" r="1.2" opacity="0.6"/>
    <circle cx="252" cy="447" r="1" opacity="0.5"/>
    <circle cx="448" cy="36" r="1.2" opacity="0.6"/>
    <circle cx="302" cy="494" r="1.2" opacity="0.6"/>
  </g>

  <text x="16" y="28" class="rotulo">ILUSTRAÇÃO · ILLUSTRATION</text>
  <text x="544" y="28" class="rotulo" text-anchor="end">docs/ARCHITECTURE.md</text>

  <!-- web -->
  <rect x="12" y="54" width="262" height="80" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="28" y="86" class="nome">web/</text>
  <text x="28" y="112" class="det">React + Vite, HTTP client</text>

  <!-- server -->
  <rect x="286" y="54" width="262" height="80" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="302" y="86" class="nome">server/</text>
  <text x="302" y="112" class="det">node:http, routes, validation</text>

  <!-- application -->
  <rect x="135" y="199" width="290" height="80" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="151" y="231" class="nome">application/</text>
  <text x="151" y="257" class="det">LabReserveService, contracts</text>

  <!-- domain -->
  <rect x="12" y="344" width="262" height="92" rx="8" class="centro" filter="url(#brilho)"/>
  <text x="28" y="376" class="nome">domain/</text>
  <text x="28" y="400" class="det">TimeInterval, Reservation</text>
  <text x="28" y="420" class="det">no HTTP, React or SQLite</text>

  <!-- persistence -->
  <rect x="286" y="344" width="262" height="92" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="302" y="376" class="nome">persistence/</text>
  <text x="302" y="400" class="det">SQLite (node:sqlite)</text>
  <text x="302" y="420" class="det">implements contracts</text>

  <!-- web -> application, server -> application, application -> domain, persistence -> application (implementa contratos) -->
  <path d="M180.8,134.4 C200,154.5 223.2,178.7 242.3,198.7" class="linha"/>
  <path d="M379.2,134.4 C360,154.5 336.8,178.7 317.7,198.7" class="linha"/>
  <path d="M244,279.1 C225.8,298.9 203.7,322.9 184.8,343.5" class="linha"/>
  <path d="M379.4,343.5 C360.9,322.9 338.8,298.9 320,279.1" class="tracejada"/>

  <text x="280" y="468" class="det" text-anchor="middle">──▶ depende de · depends on</text>
  <text x="280" y="488" class="det" text-anchor="middle">- -▶ implementa · implements</text>
</svg>

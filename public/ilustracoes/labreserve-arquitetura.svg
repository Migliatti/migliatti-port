<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d">
  <title id="t">LabReserve: modular monolith (illustration)</title>
  <desc id="d">Modules web, server, application, domain and persistence. Dependencies point inward: web and server depend on application; application depends on domain and on repository contracts; persistence implements the contracts with SQLite. The domain imports nothing from HTTP, React or SQLite.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#404040"/>
    </marker>
    <style>
      .caixa { fill: #ffffff; stroke: #404040; stroke-width: 1.5; }
      .centro { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; }
      .nome { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #171717; }
      .det { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #525252; }
      .rotulo { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #525252; letter-spacing: 0.08em; }
      .linha { stroke: #404040; stroke-width: 1.5; fill: none; marker-end: url(#seta); }
      .tracejada { stroke: #404040; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#seta); }
    </style>
  </defs>
  <rect width="800" height="460" fill="#fafafa"/>
  <text x="20" y="28" class="rotulo">ILUSTRAÇÃO · ILLUSTRATION</text>
  <text x="780" y="28" class="rotulo" text-anchor="end">docs/ARCHITECTURE.md</text>

  <!-- web -->
  <rect x="40" y="60" width="300" height="80" rx="8" class="caixa"/>
  <text x="60" y="92" class="nome">web/</text>
  <text x="60" y="118" class="det">React + Vite, HTTP client</text>

  <!-- server -->
  <rect x="460" y="60" width="300" height="80" rx="8" class="caixa"/>
  <text x="480" y="92" class="nome">server/</text>
  <text x="480" y="118" class="det">node:http, routes, validation</text>

  <!-- application -->
  <rect x="250" y="200" width="300" height="80" rx="8" class="caixa"/>
  <text x="270" y="232" class="nome">application/</text>
  <text x="270" y="258" class="det">LabReserveService, contracts</text>

  <!-- domain -->
  <rect x="40" y="340" width="300" height="90" rx="8" class="centro"/>
  <text x="60" y="372" class="nome">domain/</text>
  <text x="60" y="396" class="det">TimeInterval, Reservation</text>
  <text x="60" y="416" class="det">no HTTP, React or SQLite</text>

  <!-- persistence -->
  <rect x="460" y="340" width="300" height="90" rx="8" class="caixa"/>
  <text x="480" y="372" class="nome">persistence/</text>
  <text x="480" y="396" class="det">SQLite (node:sqlite)</text>
  <text x="480" y="416" class="det">implements contracts</text>

  <!-- web -> application, server -> application -->
  <path d="M190,140 L330,198" class="linha"/>
  <path d="M610,140 L470,198" class="linha"/>
  <!-- application -> domain -->
  <path d="M330,280 L220,338" class="linha"/>
  <!-- persistence -> application (implementa contratos) -->
  <path d="M610,340 L480,282" class="tracejada"/>

  <text x="400" y="315" class="det" text-anchor="middle">──▶ depends on</text>
  <text x="400" y="333" class="det" text-anchor="middle">- -▶ implements</text>
</svg>

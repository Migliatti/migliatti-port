<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="t d">
  <title id="t">LabReserve: booking creation flow (illustration)</title>
  <desc id="d">POST /api/reservations validates the interval with TimeInterval.create (invalid: 400 INVALID_TIME_RANGE). Inside one transaction the service checks the resource (missing: 404 RESOURCE_NOT_FOUND) and looks for a conflicting CONFIRMED reservation of the same resource using newStart &lt; existingEnd and newEnd &gt; existingStart (conflict: 409 RESERVATION_CONFLICT). Otherwise it inserts the reservation and the RESERVATION_CREATED event and commits, answering 201. Any failure rolls everything back. Cancelled reservations do not block and equal limits are allowed.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#404040"/>
    </marker>
    <style>
      .passo { fill: #ffffff; stroke: #404040; stroke-width: 1.5; }
      .decisao { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; }
      .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .erro { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
      .transacao { fill: none; stroke: #737373; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .txt { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #171717; }
      .det { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #525252; }
      .rotulo { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #525252; letter-spacing: 0.08em; }
      .linha { stroke: #404040; stroke-width: 1.5; fill: none; marker-end: url(#seta); }
    </style>
  </defs>
  <rect width="800" height="640" fill="#fafafa"/>
  <text x="20" y="28" class="rotulo">ILUSTRAÇÃO · ILLUSTRATION</text>
  <text x="780" y="28" class="rotulo" text-anchor="end">src/application/lab-reserve-service.ts</text>

  <!-- 1. requisição -->
  <rect x="60" y="50" width="420" height="44" rx="8" class="passo"/>
  <text x="80" y="77" class="txt">POST /api/reservations</text>
  <path d="M270,94 L270,118" class="linha"/>

  <!-- 2. intervalo -->
  <rect x="60" y="120" width="420" height="54" rx="8" class="decisao"/>
  <text x="80" y="143" class="txt">TimeInterval.create(startAt, endAt)</text>
  <text x="80" y="162" class="det">ISO 8601 + timezone, end &gt; start</text>
  <path d="M480,147 L548,147" class="linha"/>
  <rect x="550" y="125" width="220" height="44" rx="8" class="erro"/>
  <text x="566" y="152" class="txt">400 INVALID_TIME_RANGE</text>
  <path d="M270,174 L270,208" class="linha"/>

  <!-- transação -->
  <rect x="40" y="196" width="740" height="344" rx="10" class="transacao"/>
  <text x="764" y="214" class="det" text-anchor="end">BEGIN … COMMIT (ROLLBACK on any error)</text>

  <!-- 3. recurso -->
  <rect x="60" y="226" width="420" height="44" rx="8" class="decisao"/>
  <text x="80" y="253" class="txt">findResource(resourceId)</text>
  <path d="M480,248 L548,248" class="linha"/>
  <rect x="550" y="226" width="220" height="44" rx="8" class="erro"/>
  <text x="566" y="253" class="txt">404 RESOURCE_NOT_FOUND</text>
  <path d="M270,270 L270,296" class="linha"/>

  <!-- 4. conflito -->
  <rect x="60" y="298" width="420" height="96" rx="8" class="decisao"/>
  <text x="80" y="322" class="txt">findConflict(resourceId, start, end)</text>
  <text x="80" y="344" class="det">status = 'CONFIRMED' (cancelled don't block)</text>
  <text x="80" y="364" class="det">newStart &lt; existingEnd &amp;&amp;</text>
  <text x="80" y="382" class="det">newEnd &gt; existingStart</text>
  <path d="M480,346 L548,346" class="linha"/>
  <rect x="550" y="324" width="220" height="44" rx="8" class="erro"/>
  <text x="566" y="351" class="txt">409 RESERVATION_CONFLICT</text>
  <path d="M270,394 L270,420" class="linha"/>

  <!-- 5. gravação -->
  <rect x="60" y="422" width="420" height="96" rx="8" class="passo"/>
  <text x="80" y="446" class="txt">insertReservation(reservation)</text>
  <text x="80" y="466" class="det">status: 'CONFIRMED'</text>
  <text x="80" y="490" class="txt">insertEvent(event)</text>
  <text x="80" y="508" class="det">type: 'RESERVATION_CREATED'</text>
  <path d="M270,518 L270,566" class="linha"/>

  <!-- 6. resposta -->
  <rect x="60" y="568" width="420" height="44" rx="8" class="ok"/>
  <text x="80" y="595" class="txt">201 { "data": reservation }</text>

  <text x="550" y="440" class="det">10:00–11:00 vs 11:00–12:00</text>
  <text x="550" y="458" class="det">equal limits: allowed</text>
</svg>

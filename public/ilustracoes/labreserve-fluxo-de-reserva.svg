<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596 734" width="596" height="734" role="img" aria-labelledby="t d" data-cor-do-pulso="#d6a85f" data-compacta="">
  <title id="t">LabReserve: booking creation flow (illustration)</title>
  <desc id="d">POST /api/reservations validates the interval with TimeInterval.create (invalid: 400 INVALID_TIME_RANGE). Inside one transaction the service checks the resource (missing: 404 RESOURCE_NOT_FOUND) and looks for a conflicting CONFIRMED reservation of the same resource using newStart &lt; existingEnd and newEnd &gt; existingStart (conflict: 409 RESERVATION_CONFLICT). Otherwise it inserts the reservation and the RESERVATION_CREATED event and commits, answering 201. Any failure rolls everything back. Cancelled reservations do not block and equal limits are allowed.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a85f"/>
    </marker>
    <radialGradient id="fundo" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#19150f"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <pattern id="grade" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28,0 L0,0 L0,28" fill="none" stroke="#d6a85f" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="brilho" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .caixa { fill: #19150f; stroke: #c79a52; stroke-width: 1.5; }
      .centro { fill: #19150f; stroke: #f0c97a; stroke-width: 2.5; }
      .nome { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ece8df; }
      .det { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b3ab9c; }
      .rotulo { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #d6a85f; letter-spacing: 0.08em; }
      .linha { stroke: #d6a85f; stroke-width: 1.75; fill: none; marker-end: url(#seta); }
      .tracejada { stroke: #d6a85f; stroke-width: 1.75; fill: none; stroke-dasharray: 6 4; marker-end: url(#seta); }
      .decisao { fill: #19150f; stroke: #e3b868; stroke-width: 2; }
      .ok { fill: #19150f; stroke: #f0c97a; stroke-width: 2.5; }
      .erro { fill: #19150f; stroke: #d98a7a; stroke-width: 1.5; }
      .erro-txt { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0b7ab; }
      .nota { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b3ab9c; }
      .txt { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ece8df; }
      .transacao { fill: none; stroke: #b3ab9c; stroke-width: 1.2; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="596" height="734" fill="url(#fundo)"/>
  <rect width="596" height="734" fill="url(#grade)"/>

  <!-- estrelas -->
  <g fill="#ece8df" aria-hidden="true">
    <circle cx="18" cy="73" r="1.2" opacity="0.6"/>
    <circle cx="370" cy="55" r="1" opacity="0.5"/>
    <circle cx="566" cy="51" r="1.5" opacity="0.7"/>
    <circle cx="572" cy="139" r="1" opacity="0.5"/>
    <circle cx="402" cy="158" r="1.2" opacity="0.6"/>
    <circle cx="560" cy="242" r="1.2" opacity="0.6"/>
    <circle cx="569" cy="484" r="1.5" opacity="0.7"/>
    <circle cx="447" cy="484" r="1" opacity="0.5"/>
    <circle cx="411" cy="573" r="1.2" opacity="0.6"/>
    <circle cx="536" cy="617" r="1" opacity="0.5"/>
    <circle cx="417" cy="661" r="1.5" opacity="0.7"/>
    <circle cx="30" cy="697" r="1.2" opacity="0.6"/>
    <circle cx="578" cy="712" r="1" opacity="0.5"/>
  </g>

  <text x="16" y="28" class="rotulo">ILUSTRAÇÃO · ILLUSTRATION</text>
  <text x="580" y="28" class="rotulo" text-anchor="end">src/application/lab-reserve-service.ts</text>

  <!-- 1. requisição -->
  <rect x="16" y="48" width="334" height="44" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="32" y="75" class="txt">POST /api/reservations</text>
  <path d="M183,92 L183,116" class="linha"/>

  <!-- 2. intervalo -->
  <rect x="16" y="118" width="334" height="58" rx="8" class="decisao" filter="url(#brilho)"/>
  <text x="32" y="144" class="txt">TimeInterval.create(startAt, endAt)</text>
  <text x="32" y="164" class="det">ISO 8601 + timezone, end &gt; start</text>
  <path d="M350,147 L382,147" class="linha"/>
  <rect x="384" y="125" width="196" height="44" rx="8" class="erro" filter="url(#brilho)"/>
  <text x="396" y="152" class="erro-txt">400 INVALID_TIME_RANGE</text>
  <path d="M183,176 L183,234" class="linha"/>

  <!-- transação -->
  <rect x="8" y="204" width="580" height="384" rx="10" class="transacao"/>
  <text x="576" y="224" class="nota" text-anchor="end">BEGIN … COMMIT (ROLLBACK on any error)</text>

  <!-- 3. recurso -->
  <rect x="16" y="236" width="334" height="44" rx="8" class="decisao" filter="url(#brilho)"/>
  <text x="32" y="263" class="txt">findResource(resourceId)</text>
  <path d="M350,258 L382,258" class="linha"/>
  <rect x="384" y="236" width="196" height="44" rx="8" class="erro" filter="url(#brilho)"/>
  <text x="396" y="263" class="erro-txt">404 RESOURCE_NOT_FOUND</text>
  <path d="M183,280 L183,308" class="linha"/>

  <!-- 4. conflito -->
  <rect x="16" y="310" width="334" height="122" rx="8" class="decisao" filter="url(#brilho)"/>
  <text x="32" y="338" class="txt">findConflict(resourceId, start, end)</text>
  <text x="32" y="360" class="det">status = 'CONFIRMED'</text>
  <text x="32" y="378" class="det">(cancelled don't block)</text>
  <text x="32" y="402" class="det">newStart &lt; existingEnd &amp;&amp;</text>
  <text x="32" y="420" class="det">newEnd &gt; existingStart</text>
  <path d="M350,371 L382,371" class="linha"/>
  <rect x="384" y="349" width="196" height="44" rx="8" class="erro" filter="url(#brilho)"/>
  <text x="396" y="376" class="erro-txt">409 RESERVATION_CONFLICT</text>
  <text x="384" y="411" class="nota">10:00–11:00 vs 11:00–12:00</text>
  <text x="384" y="429" class="nota">equal limits: allowed</text>
  <path d="M183,432 L183,464" class="linha"/>

  <!-- 5. gravação -->
  <rect x="16" y="466" width="334" height="104" rx="8" class="caixa" filter="url(#brilho)"/>
  <text x="32" y="494" class="txt">insertReservation(reservation)</text>
  <text x="32" y="514" class="det">status: 'CONFIRMED'</text>
  <text x="32" y="540" class="txt">insertEvent(event)</text>
  <text x="32" y="560" class="det">type: 'RESERVATION_CREATED'</text>
  <path d="M183,570 L183,620" class="linha"/>

  <!-- 6. resposta -->
  <rect x="16" y="622" width="334" height="44" rx="8" class="ok" filter="url(#brilho)"/>
  <text x="32" y="649" class="txt">201 { "data": reservation }</text>

  <text x="298" y="694" class="det" text-anchor="middle">──▶ segue para · proceeds to</text>
  <text x="298" y="714" class="det" text-anchor="middle">borda rosada = erro · rose border = error</text>
</svg>
